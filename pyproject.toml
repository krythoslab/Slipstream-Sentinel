[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "slipstream-sentinel"
version = "2.0.0"
description = "Production-quality multi-server Discord moderation & league bot"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.3.0",
    "aiosqlite>=0.19",
]

[project.scripts]
sentinel = "sentinel.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
